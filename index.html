<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Website</title>
    <style>
        /* Optional: Center the video on the page */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000; /* Optional: black background */
        }
        video {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <video autoplay loop>
        <source src="your-video-file.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>
</html>
