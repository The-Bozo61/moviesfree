<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Full Screen Video</title>
    <style>
        /* Remove default margins and set body and html to fill the viewport */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars */
        }
        /* Make the video fill the entire screen */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensure the video covers the entire area, cropping if necessary */
        }
    </style>
</head>
<body>
    <video autoplay muted loop>
        <source src="movies_free.mp4" type="video/mp4" />
        Your browser does not support the video tag.
    </video>
</body>
</html>
