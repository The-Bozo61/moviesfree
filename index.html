<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Auto Fullscreen Video</title>
    <style>
        /* Remove default margins and hide scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        /* Make the video fill the entire viewport */
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <video id="fullscreenVideo" autoplay loop>
        <source src="movies_free.mp4" type="video/mp4" />
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('fullscreenVideo');

        // When the page loads, request fullscreen
        window.onload = () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) { /* Safari */
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) { /* IE/Edge */
                video.msRequestFullscreen();
            }
        };
    </script>
</body>
</html>
