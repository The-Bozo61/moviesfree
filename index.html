<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fullscreen Video with Sound</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background-color: black;
}
#startButton {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 20px 40px;
  font-size: 20px;
  cursor: pointer;
  z-index: 10;
  background: #fff;
  border: none;
  border-radius: 8px;
}
video {
  display: none; /* hide initially */
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>
<button id="startButton">Click to Play & Fullscreen</button>
<video id="video" controls>
  <source src="movies_free.mp4" type="video/mp4" />
  Your browser does not support the video tag.
</video>

<script>
const startButton = document.getElementById('startButton');
const video = document.getElementById('video');

startButton.onclick = () => {
  // Show the video
  video.style.display = 'block';

  // Request fullscreen
  if (video.requestFullscreen) {
    video.requestFullscreen();
  } else if (video.webkitRequestFullscreen) {
    video.webkitRequestFullscreen();
  } else if (video.msRequestFullscreen) {
    video.msRequestFullscreen();
  }

  // Play the video with sound
  video.play();

  // Hide the button
  startButton.style.display = 'none';
};
</script>
</body>
</html>
